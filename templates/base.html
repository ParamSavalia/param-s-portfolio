<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Param's Portfolio</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;600;700&display=swap"
          rel="stylesheet">
</head>
<body>

<nav>
    <div class="nav-container">
        <h1>Param's Portfolio</h1>
        <div class="menu-toggle">☰</div>
        <ul class="nav-links">
            {% for header_title_list in header_title %}
                <li><a href="{{header_title_list.href}}">{{header_title_list.title}}</a></li>
            {% endfor %}
            </ul>
    </div>
</nav>
<div class="container">
    {% block content %}
    {% endblock %}
</div>
<footer>
    <p>© 2025 Param. All rights reserved.</p>
</footer>
<script>
    // Toggle mobile menu
    document.querySelector('.menu-toggle').addEventListener('click', () => {
        document.querySelector('.nav-links').classList.toggle('active');
    });

    // Scroll reveal animation
    const sections = document.querySelectorAll('section');
    const revealSection = () => {
        sections.forEach(section => {
            const windowHeight = window.innerHeight;
            const sectionTop = section.getBoundingClientRect().top;
            if (sectionTop < windowHeight - 150) {
                section.classList.add('visible');
            }
        });
    };
    window.addEventListener('scroll', revealSection);
    revealSection();

    // Navigation bar transparency on scroll
    window.addEventListener('scroll', () => {
        const nav = document.querySelector('nav');
        if (window.scrollY > 50) {
            nav.classList.add('scrolled');
        } else {
            nav.classList.remove('scrolled');
        }
    });
</script>
</body>
</html>
